# ──────────────────────────────────────────────────────────────
# Parity — Docker Compose
# Day-2 NetOps loop powered by Dynatrace MCP + Gemini (ADK) + pyATS.
# Built for the Google Cloud Rapid Agent Hackathon, Dynatrace track.
#
# All services use parity-* names and distinct ports/volumes so the
# stack can run alongside other docker-compose projects on the same
# host without collision.
# ──────────────────────────────────────────────────────────────

networks:
  net_core:
    external: true

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parity-postgres
    restart: unless-stopped
    networks:
      - net_core
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parity}
      POSTGRES_USER: ${POSTGRES_USER:-parity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - parity-pgdata:/var/lib/postgresql/data
    # No host port publish — postgres is reachable only from other
    # containers on net_core (the backend, migrations, etc.). Use
    # `docker compose exec postgres psql -U parity` for local access
    # instead of exposing 5432 on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB ───────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: parity-chromadb
    restart: unless-stopped
    networks:
      - net_core
    volumes:
      - parity-chromadata:/chroma/chroma
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dynatrace MCP stub ─────────────────────────────────────
  # FastMCP Python service exposing list_problems / find_entity_by_name
  # / execute_dql with canned Davis-style payloads. Swap the URL in
  # backend's DT_MCP_URL env var (and disable this service) once you
  # have a real Dynatrace tenant + @dynatrace-oss/dynatrace-mcp-server.
  dynatrace-mcp:
    build:
      context: ./docker/dynatrace-mcp-stub
      dockerfile: Dockerfile
      args:
        DT_API_URL: ${DT_API_URL:-}
        DT_PAAS_TOKEN: ${PARITY_DT_PAAS_TOKEN:-}
    container_name: parity-dt-mcp
    restart: unless-stopped
    networks:
      - net_core
    environment:
      LD_PRELOAD: /opt/dynatrace/oneagent/agent/lib64/liboneagentproc.so
      DT_CUSTOM_PROP: "Project=Parity Component=mcp-stub Container=parity-dt-mcp"
      DT_TAGS: "parity parity-dt-mcp"
    ports:
      - "8220:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Real Dynatrace MCP server ──────────────────────────────
  # @dynatrace-oss/dynatrace-mcp-server v1.8.5 in HTTP mode.
  # Talks to the live kea15603 tenant via DT_ENVIRONMENT +
  # DT_PLATFORM_TOKEN passed in from .env. The backend chooses
  # this one over the stub when DT_MCP_URL is repointed at it.
  dynatrace-mcp-real:
    build:
      context: ./docker/dynatrace-mcp-real
      dockerfile: Dockerfile
      args:
        DT_API_URL: ${DT_API_URL:-}
        DT_PAAS_TOKEN: ${PARITY_DT_PAAS_TOKEN:-}
    container_name: parity-dt-mcp-real
    restart: unless-stopped
    networks:
      - net_core
    env_file:
      - .env
    environment:
      DT_MCP_DISABLE_TELEMETRY: "true"
      # OneAgent runtime hook (musl/node flavor — see Dockerfile).
      LD_PRELOAD: /opt/dynatrace/oneagent/agent/lib64/liboneagentproc.so
      DT_CUSTOM_PROP: "Project=Parity Component=mcp-real Container=parity-dt-mcp-real"
      DT_TAGS: "parity parity-dt-mcp-real"
    ports:
      - "8222:3000"

  # ── Docker socket proxy ─────────────────────────────────────
  # The backend's self-monitor (services/self_monitor.py) needs
  # `containers.list()` + `container.stats()` for every parity-*
  # container, which otherwise means mounting the raw Docker socket
  # into the backend — full Docker API access (and, via the
  # container's own image/exec endpoints, an effective route to root
  # on the host). This proxy sits between them and only forwards the
  # read-only /containers/* endpoints (list/inspect/stats); everything
  # else (exec, images, volumes, networks, build, POST/DELETE/PUT) is
  # denied by default. The backend talks to it via DOCKER_HOST (see
  # the backend service's environment below) instead of a socket
  # bind-mount.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: parity-docker-proxy
    restart: unless-stopped
    networks:
      - net_core
    environment:
      CONTAINERS: 1   # GET /containers/* only (list, inspect, stats)
      POST: 0
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      # OneAgent codemodule install during build — see Dockerfile.
      # DT_API_URL is the classic /api endpoint (not secret, passed as
      # a build ARG). DT_PAAS_TOKEN is minted via the OAuth client and
      # persisted to .env on first run (see
      # scripts/dynatrace_setup.py paas-token helper); it's passed as
      # a BuildKit secret (below), never as a build ARG, so it can't
      # leak into build logs or image history.
      args:
        DT_API_URL: ${DT_API_URL:-}
      secrets:
        - dt_paas_token
    container_name: parity-backend
    restart: unless-stopped
    networks:
      - net_core
    ports:
      - "8210:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: parity-postgres
      POSTGRES_PORT: 5432
      CHROMADB_HOST: parity-chromadb
      CHROMADB_PORT: 8000
      DT_MCP_URL: http://parity-dt-mcp:8000/mcp
      DT_REAL_MCP_URL: http://parity-dt-mcp-real:3000/mcp
      # Vertex AI / Gemini config — values read by both google-genai
      # (via env vars) and our own settings module (via .env).
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-parity-dynatrace}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # ── OneAgent runtime hook ──
      # LD_PRELOAD pulls liboneagentproc.so into every process started
      # in this container — Python, alembic, pyATS, subprocesses.
      # Tagged with parity-backend so Smartscape labels the process
      # correctly. The codemodule is baked into the image during build.
      LD_PRELOAD: /opt/dynatrace/oneagent/agent/lib64/liboneagentproc.so
      DT_CUSTOM_PROP: "Project=Parity Component=backend Container=parity-backend"
      DT_TAGS: "parity parity-backend"
      # ── OpenTelemetry (complements OneAgent for ASGI/FastAPI) ──
      # Backend uses the OTel SDK to export per-request spans,
      # DB queries, and outbound httpx calls to Dynatrace's OTel
      # endpoint. OneAgent v1.337 Python doesn't auto-instrument
      # ASGI; OTel fills the gap. Token + endpoint persisted in
      # .env on first OTel rollout.
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      PARITY_OTEL_TOKEN: ${PARITY_OTEL_TOKEN:-}
      OTEL_SERVICE_NAME: parity-backend
      # self_monitor's `docker` SDK client talks to the socket-proxy
      # below (read-only, containers-only) instead of the real Docker
      # socket — see the docker-socket-proxy service.
      DOCKER_HOST: tcp://parity-docker-proxy:2375
    volumes:
      # Mount the host's gcloud config so Application Default Credentials
      # are available inside the container without baking a key. Run
      # `gcloud auth application-default login` on the host once and the
      # google-genai SDK picks the credentials up automatically.
      #
      # For Cloud Run deployment we swap this for a service account
      # attached to the Cloud Run service — no bind mount needed.
      # Mounted under the non-root `appuser`'s home (see
      # docker/Dockerfile.backend) rather than /root.
      - ${USERPROFILE}/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
      # Named volume (not a .env bind mount) for the SNMP poller's
      # minted metrics-ingest token — see services/snmp_poller.py and
      # the note on the `.env` mount below.
      - parity-backend-state:/app/state
      # .env is mounted read-only: the backend process (self_monitor,
      # snmp_poller, etc.) only ever needs to *read* configured
      # secrets, never rewrite them. A compromised/buggy backend
      # process can no longer tamper with every secret in .env.
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      dynatrace-mcp:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (React + nginx) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: parity-frontend
    restart: unless-stopped
    networks:
      - net_core
    ports:
      - "8211:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  parity-pgdata:
  parity-chromadata:
  # backend's persisted state (currently just the minted SNMP
  # metrics-ingest token) — see services/snmp_poller.py. Separate
  # from the .env bind mount, which is read-only.
  parity-backend-state:

secrets:
  # Sourced from the PARITY_DT_PAAS_TOKEN env var (set in .env) and
  # mounted into the backend build as a BuildKit secret rather than a
  # build ARG, so the value never appears in `docker build
  # --progress=plain` output or `docker history` — see
  # docker/Dockerfile.backend.
  dt_paas_token:
    environment: PARITY_DT_PAAS_TOKEN
